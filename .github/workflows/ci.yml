name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Fast checks (~2 min) ───────────────────────────────────────────
  # Lint and test the core crate WITHOUT the "store" feature (no DuckDB).
  fast-checks:
    name: Fast checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Rustfmt
        run: cargo fmt --check
      - name: Clippy (core, no DuckDB)
        run: cargo clippy --no-default-features -- -D warnings
      - name: Rust tests (core, no DuckDB)
        run: cargo test --lib --no-default-features

  # ── Store tests ────────────────────────────────────────────────────
  # Full build linking the prebuilt libduckdb.  Only runs when store-related files
  # change (on PRs) or always on pushes to main.
  store-tests:
    name: Store tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            store:
              - 'src/store.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'

      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.store == 'true' || github.event_name == 'push'
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.store == 'true' || github.event_name == 'push'

      - name: Clippy (all features incl. DuckDB)
        if: steps.changes.outputs.store == 'true' || github.event_name == 'push'
        run: cargo clippy --all-features -- -D warnings

      - name: Rust tests (all features incl. DuckDB)
        if: steps.changes.outputs.store == 'true' || github.event_name == 'push'
        run: cargo test --lib

  # ── Python tests ───────────────────────────────────────────────────
  # Build the native extension (with DuckDB) and run pytest.
  # Ubuntu only — the Python wrapper is platform-independent, and
  # native correctness is covered by the Rust test suites above.
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Build and install
        run: uv run maturin develop --release
      - name: Run Python tests
        # The extension links the prebuilt libduckdb dynamically; release
        # wheels bundle it, a dev build has to be pointed at it.
        run: |
          export LD_LIBRARY_PATH=$(ls -d "$PWD"/target/duckdb-download/*/* | tail -1)
          uv run python -m pytest tests/python -v
